name: CI (Linux · Windows · macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Install real opencode (free model opencode/big-pickle, no API key)
        run: bun install -g opencode-ai
      - name: opencode --version
        run: opencode --version

      - name: Bridge integration test (bun test → real agent answer over SSE)
        run: bun test opencode/bridge.test.ts
        timeout-minutes: 6

      - name: Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop e2e (15 scenarios, incl. LIVE opencode window)
        run: node e2e/with-bridge.mjs
        timeout-minutes: 15

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: e2e/shots/
          if-no-files-found: ignore

  binaries:
    name: bridge binaries (all platforms)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: bun run opencode/compile-all.ts
      - name: Pack dist + binaries
        run: |
          cd release
          for f in opencode-bridge-*; do
            case "$f" in *.exe) zip -qr "${f%.exe}.zip" "$f" ../dist ;; *) tar -czf "$f.tar.gz" "$f" -C .. dist ;; esac
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-bridge-binaries
          path: |
            release/*.zip
            release/*.tar.gz
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.tar.gz
          generate_release_notes: true
